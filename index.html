<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dholera — a schematic model of the Special Investment Region</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b5693a'/%3E%3C/svg%3E" />
    <meta
      name="description"
      content="An unofficial Three.js model of Dholera SIR: the 920 km² region, the town-planning area, and the Activation Area."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Noto+Sans+Gujarati:wght@500&family=Outfit:wght@380;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/shell.css" />
  </head>
  <body>
    <div id="loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f3eee4;">
      <div style="width:48px;height:48px;border:3px solid #e3d9c8;border-top-color:#b5693a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:28px;"></div>
      <div style="font-family:'Noto Sans Gujarati',sans-serif;font-size:18px;letter-spacing:0.08em;color:#1c1915;margin-bottom:4px;">ધોલેરા</div>
      <div style="font-family:Georgia,serif;font-size:32px;font-weight:600;letter-spacing:-0.03em;color:#1c1915;margin-bottom:16px;">Dholera</div>
      <div style="font-size:13px;color:#6e655b;letter-spacing:0.06em;">Loading model…</div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <div id="app">
      <canvas id="view" aria-label="Schematic three-dimensional model of Dholera Special Investment Region"></canvas>
      <div id="labels"></div>
      <header id="top">
        <div id="brand"></div>
        <div id="tools"></div>
      </header>
      <nav id="chapters" aria-label="Chapters"></nav>
      <select id="chapter-select" aria-label="Chapter"></select>
      <article id="panel" aria-live="polite"></article>
      <canvas id="map" width="480" height="480" aria-label="Schematic map"></canvas>
      <p id="hint"></p>
      <section id="arrive"></section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
