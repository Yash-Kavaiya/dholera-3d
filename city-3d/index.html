<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Dholera Smart City 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed WebGL city; floating glass panels pinned to corners; tour card + stop dock at the bottom. */
:root {
  --bg: #cddde2;
  --glass: rgba(250, 248, 242, 0.86);
  --glass-strong: rgba(250, 248, 242, 0.96);
  --ink: #17201e;
  --muted: #55625d;
  --line: rgba(23, 32, 30, 0.12);
  --accent: #0c7565;
  --accent-ink: #ffffff;
  --accent-soft: rgba(12, 117, 101, 0.12);
  --saffron: #c26a18;
  --shadow: 0 10px 34px rgba(18, 30, 28, 0.18);
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1214; --glass: rgba(13, 19, 21, 0.82); --glass-strong: rgba(13, 19, 21, 0.95);
    --ink: #e6eeea; --muted: #95a49f; --line: rgba(230, 238, 234, 0.13);
    --accent: #42c4ae; --accent-ink: #052019; --accent-soft: rgba(66, 196, 174, 0.16);
    --saffron: #eb9c50; --shadow: 0 10px 34px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1214; --glass: rgba(13, 19, 21, 0.82); --glass-strong: rgba(13, 19, 21, 0.95);
  --ink: #e6eeea; --muted: #95a49f; --line: rgba(230, 238, 234, 0.13);
  --accent: #42c4ae; --accent-ink: #052019; --accent-soft: rgba(66, 196, 174, 0.16);
  --saffron: #eb9c50; --shadow: 0 10px 34px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.panel { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--line); box-shadow: var(--shadow); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 12px 16px 13px; border-radius: 14px; max-width: min(360px, calc(100vw - 32px - 210px)); }
.eyebrow { margin: 0 0 4px; font: 500 10.5px/1.2 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--saffron); }
.brand h1 { margin: 0; font: 700 19px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.brand p.meta { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }

.toolbar { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 4px; padding: 5px; border-radius: 12px; }
.tbtn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-weight: 500; font-size: 13px; white-space: nowrap; }
.tbtn:hover { background: var(--accent-soft); }
.tbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tbtn svg { width: 16px; height: 16px; flex: none; }

#tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-strong); color: var(--ink); font: 500 11.5px/1 var(--f-body); white-space: nowrap; pointer-events: auto; box-shadow: 0 3px 10px rgba(0,0,0,.14); transition: opacity .25s, background .2s; will-change: transform; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--saffron); box-shadow: 0 0 0 3px color-mix(in srgb, var(--saffron) 25%, transparent); }
.tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: var(--ink); opacity: .35; }
.tag.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tag.on::before { background: var(--accent-ink); }

.tour { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.tour > * { pointer-events: auto; }
.card { width: min(440px, 100%); border-radius: 16px; padding: 16px 18px 15px; }
.card .kicker { margin: 0 0 6px; font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; gap: 10px; }
.card .kicker span:last-child { color: var(--muted); }
.card h2 { margin: 0 0 7px; font: 600 21px/1.18 var(--f-display); letter-spacing: -0.015em; text-wrap: balance; }
.card p.body { margin: 0; color: var(--muted); line-height: 1.55; font-size: 13.5px; max-width: 62ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 13px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
.facts div { display: flex; flex-direction: column-reverse; gap: 3px; min-width: 0; }
.facts dt { font-size: 11px; color: var(--muted); }
.facts dd { margin: 0; font: 600 13.5px/1.25 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.dock { display: flex; align-items: center; gap: 6px; width: min(980px, 100%); border-radius: 14px; padding: 6px; position: relative; overflow: hidden; }
.ctrl { width: 38px; height: 38px; flex: none; border: 0; border-radius: 9px; background: transparent; display: grid; place-items: center; }
.ctrl:hover { background: var(--accent-soft); }
.ctrl.play { background: var(--accent); color: var(--accent-ink); }
.ctrl svg { width: 18px; height: 18px; }
.stops { display: flex; gap: 2px; margin: 0; padding: 0 2px; list-style: none; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.stops::-webkit-scrollbar { display: none; }
.stops button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; white-space: nowrap; font-size: 12.5px; color: var(--muted); }
.stops button:hover { color: var(--ink); background: var(--accent-soft); }
.stops .n { font: 500 10.5px/1 var(--f-mono); opacity: .8; }
.stops button[aria-current="step"] { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.stops button[aria-current="step"] .n { color: var(--accent); opacity: 1; }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); }
.note { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font: 500 10.5px/1 var(--f-mono); letter-spacing: .06em; color: var(--muted); padding: 6px 9px; border-radius: 8px; }

#loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; transition: opacity .6s; }
#loader div { font: 600 15px/1.4 var(--f-display); color: var(--ink); text-align: center; }
#loader small { display: block; font: 500 11px/1.4 var(--f-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
#loader.done { opacity: 0; pointer-events: none; }

@media (max-width: 1100px) { .note { display: none; } }
@media (max-width: 640px) {
  .brand { max-width: calc(100vw - 32px - 96px); padding: 10px 12px; }
  .brand h1 { font-size: 16px; }
  .brand p.meta { display: none; }
  .tbtn .lbl { display: none; }
  .tbtn { padding: 0 9px; }
  .card { padding: 13px 14px 12px; }
  .card h2 { font-size: 17px; }
  .card p.body { font-size: 12.5px; line-height: 1.45; }
  .facts { gap: 8px; margin-top: 10px; padding-top: 9px; }
  .facts dd { font-size: 12px; }
  .stops .t { display: none; }
  .stops button { padding: 0 9px; }
  .stops button[aria-current="step"] .t { display: inline; }
}
@media (prefers-reduced-motion: reduce) { .tag, #loader { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D model of Dholera smart city" tabindex="0"></canvas>
<div id="tags" aria-label="Landmarks"></div>

<header class="brand panel">
  <p class="eyebrow">Dholera SIR · Gujarat</p>
  <h1>Dholera Smart City</h1>
  <p class="meta">Greenfield industrial city on the Gulf of Khambhat</p>
</header>

<div class="toolbar panel" role="toolbar" aria-label="View options">
  <button class="tbtn" id="btnNight" aria-pressed="false" title="Toggle day and night (N)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span class="lbl">Night</span>
  </button>
  <button class="tbtn" id="btnRoam" aria-pressed="false" title="Hide the tour and explore freely">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
    <span class="lbl">Free roam</span>
  </button>
</div>

<section class="tour" aria-label="Guided tour">
  <article class="card panel" id="card" aria-live="polite">
    <p class="kicker"><span id="kicker"></span><span id="count"></span></p>
    <h2 id="title"></h2>
    <p class="body" id="body"></p>
    <dl class="facts" id="facts"></dl>
  </article>
  <nav class="dock panel" aria-label="Tour stops">
    <button class="ctrl" id="btnPrev" aria-label="Previous stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="ctrl play" id="btnPlay" aria-label="Pause tour"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="ctrl" id="btnNext" aria-label="Next stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <ol class="stops" id="stops"></ol>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  </nav>
</section>
<div class="note panel">Illustrative model · not to scale</div>
<div id="loader"><div>Laying out Dholera<small>Generating city</small></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
